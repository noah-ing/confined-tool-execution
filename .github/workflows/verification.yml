name: Verification

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    name: Policy and Linux process verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Python tooling
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen --extra verification
      - name: Verify portable policy and source
        run: |
          uv run --frozen pytest -m 'not linux_confinement'
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy src examples fixtures scripts
          uv run --frozen bandit -q -r src examples fixtures scripts
          uv run --frozen pip-audit --skip-editable --progress-spinner off
      - name: Build and inspect distribution
        run: |
          uv build
          uv run --frozen python scripts/verify_distribution.py
      - name: Require Linux enforcement and verify both phases
        run: |
          docker compose config --quiet
          docker compose build verification
          docker compose run --rm verification
      - name: Remove verification resources
        if: always()
        run: docker compose down
